<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>Pi Launcher 菜单</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: #ffffff;
      --ink: #24272d;
      --muted: #7d818b;
      --line: rgba(32, 36, 45, .08);
      --hover: rgba(32, 36, 45, .055);
      --accent: #aa6253;
      --accent-soft: rgba(201, 119, 101, .12);
      --ok: #4f8a6b;
      --shadow: 0 22px 56px -18px rgba(28, 31, 40, .34), 0 3px 10px -4px rgba(28, 31, 40, .14);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1e1f24;
        --ink: #ededef;
        --muted: #9699a3;
        --line: rgba(255, 255, 255, .08);
        --hover: rgba(255, 255, 255, .07);
        --accent: #e1a18c;
        --accent-soft: rgba(225, 161, 140, .14);
        --ok: #7fc09b;
        --shadow: 0 22px 56px -16px rgba(0, 0, 0, .66), 0 3px 10px -4px rgba(0, 0, 0, .4);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body {
      padding: 12px;
      color: var(--ink);
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .card {
      height: 100%;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      /* The window is a fixed 316x520 and cannot be resized, so every item is
         `flex: none`. Without this, a taller item list (new action, larger
         system font, zoomed webview) pushed the last rows — including 退出 —
         past the edge with no way to reach them. */
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
      animation: pop .16s cubic-bezier(.2, .8, .3, 1) both;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.985); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }

    .head { display: flex; align-items: center; gap: 10px; padding: 10px 12px 8px; }
    .head img { width: 26px; height: 26px; flex: none; }
    .head-text { min-width: 0; }
    .name { font-weight: 650; font-size: 13.5px; letter-spacing: -.2px; line-height: 1.25; }
    .sub { color: var(--muted); font-size: 11px; line-height: 1.4; margin-top: 1px; }
    .badge {
      margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px; border-radius: 99px;
      background: var(--hover); color: var(--muted);
      font-size: 10.5px; font-weight: 550; white-space: nowrap;
    }
    .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
    .badge[data-ready="true"] { background: rgba(79, 138, 107, .12); color: var(--ok); }
    .badge[data-ready="true"] .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(79, 138, 107, .13); }

    .endpoint {
      margin: 0 8px 6px; padding: 7px 10px;
      border-radius: 9px; background: var(--hover);
      display: flex; align-items: center; gap: 8px;
      color: var(--muted); font-size: 11px;
      overflow: hidden;
    }
    .endpoint .url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .endpoint .ver { margin-left: auto; flex: none; opacity: .8; }

    .sep { height: 1px; margin: 5px 10px; background: var(--line); flex: none; }

    button.item, a.item {
      appearance: none; width: 100%; border: 0; background: none;
      display: flex; align-items: center; gap: 11px;
      padding: 9px 11px; border-radius: 9px;
      color: var(--ink); font: inherit; text-align: left; text-decoration: none;
      cursor: pointer; flex: none;
    }
    button.item:hover, a.item:hover, button.item:focus-visible { background: var(--hover); outline: none; }
    button.item:focus-visible { box-shadow: inset 0 0 0 1px var(--accent); }
    button.item:disabled { opacity: .42; cursor: default; }
    button.item:disabled:hover { background: none; }
    .item svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
    .item .label { flex: 1; min-width: 0; }
    .item .key { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .item[aria-checked="true"] .key { color: var(--ok); }
    .autostart-status {
      flex: none; margin: 0 12px 5px; color: var(--muted);
      font-size: 10.5px; line-height: 1.45; overflow-wrap: anywhere;
    }
    .head, .endpoint, .zoom { flex: none; }
    button.item.danger:hover { background: rgba(190, 80, 70, .1); color: #c1544a; }
    button.item.danger:hover svg { color: #c1544a; }

    .zoom { display: flex; align-items: center; gap: 4px; padding: 3px 8px 5px; }
    .zoom .zlabel { display: flex; align-items: center; gap: 11px; padding: 0 3px 0 11px; flex: 1; color: var(--ink); }
    .zoom .zlabel svg { width: 16px; height: 16px; color: var(--muted); }
    .zbtn {
      appearance: none; border: 1px solid var(--line); background: var(--hover);
      color: var(--ink); border-radius: 7px; height: 26px; min-width: 28px;
      font: inherit; font-size: 12px; cursor: pointer; padding: 0 6px;
      font-variant-numeric: tabular-nums;
    }
    .zbtn:hover { background: var(--accent-soft); border-color: transparent; }
    .zbtn:focus { outline: none; }
    .zbtn:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .zbtn.value { min-width: 46px; font-weight: 600; }
    .zbtn.preset { font-size: 10.5px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card" role="menu" aria-label="Pi Launcher 菜单">
    <div class="head">
      <img src="icon.svg" alt="">
      <div class="head-text">
        <div class="name">Pi Launcher</div>
        <div class="sub" id="subtitle">正在启动本地服务…</div>
      </div>
      <span class="badge" id="badge" data-ready="false"><span class="dot"></span><span id="badge-text">启动中</span></span>
    </div>

    <div class="endpoint">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>
      <span class="url" id="endpoint">等待连接</span>
      <span class="ver" id="version"></span>
    </div>

    <div class="sep"></div>
    <button class="item" data-action="show" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="15" rx="2"/><path d="M3 9h18M8 19v2M16 19v2"/></svg>
      <span class="label">显示主窗口</span>
    </button>
    <button class="item" data-action="browser" id="action-browser" role="menuitem" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"/></svg>
      <span class="label">在浏览器中打开</span>
    </button>
    <button class="item" data-action="copy" id="action-copy" role="menuitem" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      <span class="label">复制 Web 地址</span>
    </button>

    <div class="sep"></div>
    <div class="zoom">
      <span class="zlabel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M8.5 11h5M11 8.5v5"/></svg>
        <span>缩放</span>
      </span>
      <button class="zbtn" data-action="zoom-out" title="缩小" aria-label="缩小">−</button>
      <button class="zbtn value" data-action="zoom-reset" id="zoom-value" title="重置为 100%" aria-label="重置缩放">100%</button>
      <button class="zbtn" data-action="zoom-in" title="放大" aria-label="放大">+</button>
      <button class="zbtn preset" data-action="zoom-125" title="设为 125%">125%</button>
    </div>

    <div class="sep"></div>
    <button class="item" data-action="config-dir" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span class="label">打开配置目录</span>
    </button>
    <button class="item" data-action="log-dir" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg>
      <span class="label">打开日志目录</span>
    </button>

    <div class="sep"></div>
    <button class="item" data-action="autostart-toggle" id="action-autostart" role="menuitemcheckbox" aria-checked="mixed" aria-describedby="autostart-status" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9M6.3 5.7a8 8 0 1 0 11.4 0"/></svg>
      <span class="label">开机自启</span>
      <span class="key" id="autostart-value" aria-hidden="true">状态未知</span>
    </button>
    <p class="autostart-status" id="autostart-status" role="status" aria-live="polite" aria-atomic="true">打开菜单后读取登录自启状态。</p>
    <button class="item danger" data-action="quit" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 8l4 4-4 4M19 12H9"/></svg>
      <span class="label">退出</span>
    </button>
  </div>
  <script src="tray.js" defer></script>
</body>
</html>
