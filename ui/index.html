<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'; connect-src ipc: http://ipc.localhost; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>Pi Launcher</title>
  <style>
    :root {
      color-scheme: light dark;
      --canvas: #f5f5f3;
      --surface: rgba(255, 255, 255, .86);
      --ink: #24272d;
      --muted: #737780;
      --line: rgba(32, 36, 45, .075);
      --accent: #aa6253;
      --accent-soft: rgba(201, 119, 101, .10);
      --track: rgba(32, 36, 45, .055);
      --shadow: 0 24px 80px -32px rgba(42, 47, 60, .18), 0 4px 16px -8px rgba(42, 47, 60, .06);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .ambient { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .ambient::before, .ambient::after {
      content: "";
      position: absolute;
      width: 680px;
      height: 680px;
      border-radius: 50%;
      filter: blur(60px);
      opacity: .5;
    }
    .ambient::before { top: calc(50% - 500px); left: calc(50% - 600px); background: radial-gradient(circle, #f1dcd3, transparent 68%); }
    .ambient::after { bottom: calc(50% - 500px); right: calc(50% - 600px); background: radial-gradient(circle, #d6e5ee, transparent 68%); }
    .shell { width: min(100%, 454px); animation: appear .55s ease-out both; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 4px 22px; }
    .brand img { width: 28px; height: 28px; }
    .brand-name { font-size: 15px; font-weight: 600; letter-spacing: -.35px; }
    .brand-tag { margin-left: auto; color: var(--muted); font-size: 10px; letter-spacing: 1.7px; }
    .card {
      padding: 38px 36px 28px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .symbol {
      position: relative;
      display: grid;
      place-items: center;
      width: 70px;
      height: 70px;
      margin-bottom: 27px;
      border: 1px solid var(--line);
      border-radius: 21px;
      background: linear-gradient(145deg, var(--surface), var(--accent-soft));
      box-shadow: 0 4px 14px -8px rgba(201, 119, 101, .3);
    }
    .symbol img { width: 56px; height: 56px; }
    .symbol::after {
      content: "";
      position: absolute;
      right: -4px;
      bottom: -4px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--surface);
      border: 5px solid var(--canvas);
      box-shadow: inset 0 0 0 2px var(--accent);
    }
    h1 { margin: 0; font-size: 25px; font-weight: 600; letter-spacing: -.8px; line-height: 1.4; }
    .subtitle { margin: 10px 0 32px; font-size: 13px; color: var(--muted); line-height: 1.8; }
    .status { display: flex; gap: 10px; align-items: center; font-size: 12px; font-weight: 500; }
    .spinner { width: 13px; height: 13px; flex: 0 0 auto; border: 1.5px solid var(--accent-soft); border-top-color: var(--accent); border-right-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    .track { height: 3px; margin-top: 15px; border-radius: 3px; background: var(--track); overflow: hidden; }
    .track::after { content: ""; display: block; width: 42%; height: 100%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: sweep 2s ease-in-out infinite; }
    .steps { display: flex; justify-content: space-between; gap: 10px; margin: 22px 0 0; padding: 0; list-style: none; }
    .step { display: flex; gap: 7px; align-items: center; color: var(--muted); font-size: 11px; }
    .step-dot { display: grid; place-items: center; width: 15px; height: 15px; border: 1px solid var(--line); border-radius: 50%; font-size: 9px; }
    body[data-phase="environment"] [data-step="environment"],
    body[data-phase="backend"] [data-step="backend"],
    body[data-phase="workspace"] [data-step="workspace"] { color: var(--accent); }
    body[data-phase="environment"] [data-step="environment"] .step-dot,
    body[data-phase="backend"] [data-step="backend"] .step-dot,
    body[data-phase="workspace"] [data-step="workspace"] .step-dot { border-color: var(--accent); background: var(--accent-soft); }
    body[data-phase="backend"] [data-step="environment"] .step-dot,
    body[data-phase="workspace"] [data-step="environment"] .step-dot,
    body[data-phase="workspace"] [data-step="backend"] .step-dot { color: var(--accent); background: var(--accent-soft); border-color: transparent; font-size: 0; }
    body[data-phase="backend"] [data-step="environment"] .step-dot::after,
    body[data-phase="workspace"] [data-step="environment"] .step-dot::after,
    body[data-phase="workspace"] [data-step="backend"] .step-dot::after { content: "✓"; font-size: 10px; }
    .footer { display: flex; justify-content: center; align-items: center; gap: 7px; margin-top: 23px; color: var(--muted); font-size: 10px; letter-spacing: .15px; }
    .footer svg { width: 12px; height: 12px; opacity: .7; }
    .divider { margin: 0 3px; opacity: .45; }
    .endpoint { font-family: "Cascadia Code", Consolas, monospace; font-size: 10px; }
    /* Startup failure: the message box may be refused by policy, so the reason
       and the log path stay on screen instead. */
    .error-box {
      margin: 18px 0 0;
      padding: 12px 14px;
      max-height: 220px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--track);
      color: var(--ink);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      line-height: 1.65;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }
    body[data-phase="failed"] .track,
    body[data-phase="failed"] .steps { display: none; }
    body[data-phase="failed"] .symbol { opacity: .45; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sweep { from { transform: translateX(-110%); } to { transform: translateX(350%); } }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #141518;
        --surface: rgba(29, 30, 35, .94);
        --ink: #ededef;
        --muted: #9295a0;
        --line: rgba(255, 255, 255, .065);
        --accent: #e1a18c;
        --accent-soft: rgba(225, 161, 140, .10);
        --track: rgba(255, 255, 255, .055);
        --shadow: 0 24px 80px -24px rgba(0, 0, 0, .42), 0 4px 16px -8px rgba(0, 0, 0, .2);
      }
      .ambient { opacity: .2; }
      .ambient::before { background: radial-gradient(circle, #704b44, transparent 68%); }
      .ambient::after { background: radial-gradient(circle, #375563, transparent 68%); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .track::after { transform: translateX(65%); }
    }
    @media (max-width: 420px) {
      body { padding: 24px 18px; }
      .card { padding: 30px 24px 24px; }
      h1 { font-size: 22px; }
      .brand-tag { letter-spacing: 1px; }
    }
  </style>
</head>
<body data-phase="environment">
  <div class="ambient" aria-hidden="true"></div>
  <main class="shell">
    <header class="brand">
      <img src="icon.svg" alt="">
      <span class="brand-name">Pi Launcher</span>
      <span class="brand-tag">YOUR LOCAL WORKSPACE</span>
    </header>
    <section class="card" aria-labelledby="heading" aria-busy="true">
      <div class="symbol" aria-hidden="true"><img src="icon.svg" alt=""></div>
      <h1 id="heading">正在准备工作空间</h1>
      <p class="subtitle">一切就绪后，将自动为你打开。</p>
      <div class="status" id="status-bar" role="status" aria-live="polite" aria-atomic="true">
        <span class="spinner" aria-hidden="true"></span>
        <span id="status-text">正在检查运行环境</span>
      </div>
      <div class="track" role="progressbar" aria-label="启动进度（不定进度）"></div>
      <ol class="steps" aria-label="启动阶段">
        <li class="step" data-step="environment" aria-current="step"><span class="step-dot" aria-hidden="true">1</span>运行环境</li>
        <li class="step" data-step="backend"><span class="step-dot" aria-hidden="true">2</span>本地服务</li>
        <li class="step" data-step="workspace"><span class="step-dot" aria-hidden="true">3</span>工作空间</li>
      </ol>
      <pre class="error-box" id="error-box" hidden></pre>
    </section>
    <footer class="footer">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="2" y="2.5" width="12" height="8.5" rx="1.5"/><path d="M5.5 14h5M8 11v3"/></svg>
      <span>本地运行</span><span class="divider">·</span><span class="endpoint" id="endpoint">127.0.0.1</span>
    </footer>
  </main>
</body>
</html>
