name: Build Windows

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish to GitHub Release (create version tag)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Package Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the fixed source commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Actions use Node 24 internally; keep the project toolchain on Node 22.
      - name: Set up Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm

      # Cargo.toml requires Rust >=1.90. Use the native Windows MSVC target.
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install locked Node tooling
        run: npm ci

      - run: npm run check:version
      - run: npm run check:syntax
      - run: npm test
      - run: npm run build:ui
      - name: Verify tray layout in isolated Edge
        run: npm run test:ui:layout
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      # Tauri CLI runs cargo build with --locked and bundles NSIS, no updater/publish.
      - name: Build unsigned Tauri NSIS installer
        run: npm run build

      - name: Stage release attachments in runner temporary storage
        run: npm run stage:installer -- --release-output "${{ runner.temp }}/pi-launcher-release"

      - name: Upload only installer and checksum
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pi-launcher-windows-x64
          path: |
            ${{ runner.temp }}/pi-launcher-release/pi-launcher-*-x64-setup.exe
            ${{ runner.temp }}/pi-launcher-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pi-launcher-release
      cancel-in-progress: false
    steps:
      - name: Check out the built source commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download this run's installer and checksums
        uses: actions/download-artifact@v8.0.2
        with:
          name: pi-launcher-windows-x64
          path: ${{ runner.temp }}/pi-launcher-release

      - name: Publish a new version without overwriting existing releases
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { publishRelease } = require('./scripts/publish-release.js')
            const release = await publishRelease({
              github, context, core,
              directory: require('node:path').join(process.env.RUNNER_TEMP, 'pi-launcher-release'),
              version: require('./package.json').version,
            })
            await core.summary
              .addHeading('Release published')
              .addLink('Download Pi Launcher', release.html_url)
              .write()
