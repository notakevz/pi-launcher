[package]
name = "pi-launcher-tauri"
version = "0.1.1"
description = "Windows desktop launcher for an npm-installed or locally built Pi Web backend (Tauri v2)"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "pi_launcher_tauri_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
# Process identity and job objects through Win32. Replaces the PowerShell/CIM
# probe, which cost 1.2-2.1 s per call on the startup path.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Wdk_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
